<!doctype html>
<!--
  These two attributes are `default AppearanceSettings appearance_settings` from
  docs/specs/appearance.allium, stated in the markup so the prerendered page
  paints the platform default with no store to hydrate first. Dark is home; see
  docs/design/direction.md.

  data-animations="on" is stated rather than omitted: app.css reads the
  attribute, so leaving it out would quietly mean animations are off, which is
  not what the default record says. data-high-contrast is absent because app.css
  matches the literal string "true" and the setting's default is false.

  Both attributes carry the reader's settings and only those. Appearance derives
  what actually renders from the settings and the device together, and this page
  reads no device preference at all:

    - dark_active's `system` branch is unreachable, because the hub ships no
      settings control and theme is stated as `dark` here.
    - high_contrast_active is `high_contrast or prefers_more_contrast`, and
      `prefers-contrast: more` reaches no selector in app.css.
    - animations_active is the setting `and not prefers_reduced_motion`, and
      `prefers-reduced-motion` reaches no rule in app.css either.

  So two of the three are unhonoured rather than merely unreachable, and neither
  is waiting on the preferences port — src/lib/ports/preferences.ts exists, and
  nothing on this route calls it — because a media query would answer both.
  docs/explanation/accessibility.md owns that account.
-->
<html lang="en" data-theme="dark" data-animations="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
