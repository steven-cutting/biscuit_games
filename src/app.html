<!doctype html>
<!--
  These two attributes are `default AppearanceSettings appearance_settings` from
  docs/specs/appearance.allium, stated in the markup so the prerendered page
  paints the platform default with no store to hydrate first. Dark is home; see
  docs/design/direction.md.

  data-animations="on" is stated rather than omitted: app.css reads the
  attribute, so leaving it out would quietly mean animations are off, which is
  not what the default record says. data-high-contrast is correctly absent —
  app.css matches the literal string "true" and the default is false.

  The hub ships no settings control and no preferences port, so the `system`
  branch of Appearance.dark_active is unreachable here today.
-->
<html lang="en" data-theme="dark" data-animations="on">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
